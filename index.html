
<!DOCTYPE html>

  <head>

    <title>LaunchLens: AI Startup Idea Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }

      /* 1. Global Base Animation (Initial Load) - 350ms */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.35s ease-out forwards;
        opacity: 0; /* Start hidden */
      }

      /* 2. Scorecard Reveal (Data Arrives) - 300ms, 10px Slide */
      @keyframes slideUpFade {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up-fade {
        animation: slideUpFade 0.3s ease-out forwards;
        opacity: 0; /* Start hidden */
      }

      /* 3. Final Score Pulse (Focus) - 200ms */
      @keyframes scorePulse {
        0% { text-shadow: 0 0 0 transparent; filter: brightness(1); }
        50% { text-shadow: 0 0 20px #22d3ee; filter: brightness(1.25); }
        100% { text-shadow: 0 0 0 transparent; filter: brightness(1); }
      }
      .animate-score-pulse {
        animation: scorePulse 0.2s ease-out forwards;
      }
    </style>
